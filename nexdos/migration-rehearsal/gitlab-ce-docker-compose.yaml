# Fully bundled Omnibus gitlab-ce, with its own built-in container registry.
# This is the end state of the migration away from sameersbn/gitlab + a standalone
# registry:2 container. It replaces BOTH the old gitlab and registry services.
#
# Validated in a local rehearsal (nxreh project) against a real backup/restore and
# registry data migration from a sameersbn/gitlab 19.4.1 + registry:2 setup that
# mirrors nexdos's production topology. See migrate-to-gitlab-ce.sh for the
# one-time cutover procedure that populates this container from the old setup.
#
# Before first `docker compose up`, copy .env.example to .env and fill in real values.

services:
  gitlab-ce:
    restart: always
    image: gitlab/gitlab-ce:${GITLAB_CE_VERSION:-19.4.1-ce.0}
    container_name: ${GITLAB_CE_CONTAINER_NAME:-gitlab-ce}
    hostname: ${GITLAB_HOSTNAME:-gitlab.example.com}
    shm_size: "256m"
    ports:
      - "${GITLAB_HTTP_PORT:-80}:80"
      - "${GITLAB_HTTPS_PORT:-443}:443"
      - "${GITLAB_SSH_PORT:-22}:22"
      - "${GITLAB_REGISTRY_PORT:-5050}:5050"
    volumes:
      - gitlab-ce-config:/etc/gitlab
      - gitlab-ce-logs:/var/log/gitlab
      - gitlab-ce-data:/var/opt/gitlab
      # Host-side staging area for backup tarballs created by migrate-to-gitlab-ce.sh
      # and for the day-2 `GITLAB_BACKUP_SCHEDULE`-driven backups this container makes itself.
      - ./backups:/var/opt/gitlab/backups
    environment:
      GITLAB_OMNIBUS_CONFIG: |
        external_url 'https://${GITLAB_HOSTNAME:-gitlab.example.com}'
        gitlab_rails['gitlab_shell_ssh_port'] = ${GITLAB_SSH_PORT:-22}

        # Omnibus's own container registry, bundled in this same image - this is
        # what fixes the automated cleanup-policy bug the old registry:2 setup had.
        registry_external_url 'https://${GITLAB_HOSTNAME:-gitlab.example.com}:${GITLAB_REGISTRY_PORT:-5050}'
        registry['enable'] = true

        # NOTE: the registry's metadata database is enabled by default in this
        # version (confirmed in /var/opt/gitlab/registry/config.yml -> database:
        # {"enabled":"prefer",...} with no gitlab.rb setting needed). That DB is
        # what makes GitLab's registry API extensions - and therefore the
        # automated cleanup policy - actually work. Data copied in from the old
        # registry:2 filesystem still needs one explicit one-time
        # `gitlab-ctl registry-database import` (done by migrate-to-gitlab-ce.sh).

        gitlab_rails['backup_keep_time'] = ${GITLAB_BACKUP_KEEP_TIME:-604800}
        gitlab_rails['gitlab_email_enabled'] = ${GITLAB_EMAIL_ENABLED:-false}
        prometheus_monitoring['enable'] = false

volumes:
  gitlab-ce-config:
  gitlab-ce-logs:
  gitlab-ce-data:
