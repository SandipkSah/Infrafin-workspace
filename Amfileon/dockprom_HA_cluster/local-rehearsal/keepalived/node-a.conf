# node-a — Grafana floating IP. Identical on both nodes except router_id, priority and the IPs.
global_defs {
    router_id node-a
    script_user root
    enable_script_security
}

vrrp_script chk_grafana {
    script "/usr/bin/curl -fsS -m 2 -o /dev/null http://127.0.0.1:3000/api/health"
    interval 2
    fall 3
    rise 2
}

vrrp_instance GRAFANA {
    state BACKUP              # both BACKUP + nopreempt: the VIP does not bounce back on recovery
    nopreempt
    interface eth0
    virtual_router_id 51
    priority 150
    advert_int 1
    unicast_src_ip 172.31.10.20
    unicast_peer {
        172.31.10.21
    }
    virtual_ipaddress {
        172.31.10.100/24 dev eth0
    }
    track_script {
        chk_grafana
    }
}
