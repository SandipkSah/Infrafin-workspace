# Identical on both monitor nodes; only the REPLICA environment variable differs.
global:
  scrape_interval: 5s
  evaluation_interval: 5s
  external_labels:
    cluster: amfileon-rehearsal
    replica: ${REPLICA}

rule_files:
  - "alert.rules"   # unchanged from dockprom

scrape_configs:
  - job_name: 'nodeexporter'
    static_configs:
      - targets: ['172.31.10.20:9100', '172.31.10.21:9100', '172.31.10.13:9100', '172.31.10.30:9100', '172.31.10.31:9100']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['172.31.10.20:8080', '172.31.10.21:8080', '172.31.10.13:8080', '172.31.10.30:8080', '172.31.10.31:8080']

  - job_name: 'prometheus'
    static_configs:
      - targets: ['172.31.10.20:9090', '172.31.10.21:9090']

  - job_name: 'pushgateway'
    honor_labels: true
    static_configs:
      - targets: ['172.31.10.20:9091']

alerting:
  # Without this, the two replicas' alerts differ by the `replica` label and Alertmanager treats
  # them as two different alerts — sending every notification twice.
  alert_relabel_configs:
    - action: labeldrop
      regex: replica
  alertmanagers:
    - static_configs:
        - targets: ['172.31.10.20:9093', '172.31.10.21:9093']   # both, always
