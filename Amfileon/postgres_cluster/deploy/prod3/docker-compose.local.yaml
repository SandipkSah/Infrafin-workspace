name: amf-prod3
# Real host: prod3 (10.10.10.13). Runs ONLY the third etcd voter (no Postgres).

networks:
  amf-ha:
    external: true          # shared local "LAN"; PROD: host network / real subnet

services:
  etcd3:
    image: quay.io/coreos/etcd:v3.5.21
    hostname: etcd3
    networks: [amf-ha]
    restart: always
    command: >
      etcd --name etcd3 --enable-v2=true
      --initial-cluster etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380
      --initial-cluster-state new --initial-cluster-token amf
      --initial-advertise-peer-urls http://etcd3:2380
      --listen-peer-urls http://0.0.0.0:2380
      --listen-client-urls http://0.0.0.0:2379
      --advertise-client-urls http://etcd3:2379
    # PROD DELTA: mTLS (https, --client-cert-auth, --trusted-ca-file, cert/key), real advertise IPs,
    # and DROP --enable-v2 (use etcd3 API from Patroni).
