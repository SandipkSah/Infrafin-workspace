apiVersion: 1
# Same names/uids as grafana-local, so the generated dashboards work unchanged.
datasources:
  - name: Prometheus-db1
    uid: prom-db1
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData: { timeInterval: 15s }
  - name: Prometheus-db2
    uid: prom-db2
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    editable: false
    jsonData: { timeInterval: 15s }
