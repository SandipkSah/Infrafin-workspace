# db1 Alertmanager. Contains no secrets and can be committed:
#   __PLACEHOLDERS__ are filled from .env at start-up (see docker-compose.yaml),
#   the SMTP password and the healthchecks.io URL are written to /tmp files from .env.
global:
  smtp_smarthost: '__SMTP_SMARTHOST__'
  smtp_from: '__SMTP_FROM__'
  smtp_auth_username: '__SMTP_USERNAME__'
  smtp_auth_password_file: /tmp/smtp_password
  smtp_require_tls: true

route:
  receiver: team
  group_by: ['alertname', 'host']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    # Heartbeat: never shown to the team; healthchecks.io pages if it stops arriving.
    # __WATCHDOG_RECEIVER__ = heartbeat when HEALTHCHECKS_PING_URL is set in .env, else discard
    # (then nothing pages you if db1 itself dies — set the URL as soon as possible).
    - matchers: ['alertname="Watchdog"']
      receiver: __WATCHDOG_RECEIVER__
      group_wait: 0s
      group_interval: 1m
      repeat_interval: 1m

receivers:
  - name: team
    email_configs:
      - to: '__ALERT_EMAIL_TO__'     # ALERT_EMAIL_TO in .env (now ssa@infrafin.de, later the team address)
        send_resolved: true
  - name: heartbeat
    webhook_configs:
      - url_file: /tmp/healthchecks_ping_url
        send_resolved: false
  - name: discard           # no integrations: alerts routed here are dropped
