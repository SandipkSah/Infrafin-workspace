# /srv/docker/grafana-dashboards on db1 — the Amfileon dashboards at https://grafana.amf
# (prometheus_alloy_monitoring; staged by deploy/stage.sh grafana-dashboards db1).
#
# Same Grafana, datasources and dashboards as grafana-local/ on the Mac. No port is published:
# nginx-proxy terminates TLS (certificate grafana.amf from /srv/docker/proxy) and forwards over
# proxy_network. Grafana's own login is required; nothing is shared anonymously or externally.
#
#   .env           GRAFANA_PROMETHEUS_PASSWORD (read-only user on both Prometheus), GRAFANA_ADMIN_PASSWORD
#   provisioning/  datasources Prometheus-db1/-db2 + dashboard provider (from grafana-local/)
#   dashboards/    generated by grafana-local/gen_dashboards.py
services:
  grafana:
    image: grafana/grafana:12.0.2
    restart: unless-stopped
    environment:
      VIRTUAL_HOST: grafana.amf                   # nginx-proxy vhost
      VIRTUAL_PORT: "3000"
      GRAFANA_PROMETHEUS_PASSWORD: ${GRAFANA_PROMETHEUS_PASSWORD:?set in .env}
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set in .env}   # first start only; afterwards stored in Grafana
      GF_SERVER_DOMAIN: grafana.amf
      GF_SERVER_ROOT_URL: https://grafana.amf/
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_SECURITY_DISABLE_GRAVATAR: "true"        # no requests to gravatar.com
      GF_SNAPSHOTS_EXTERNAL_ENABLED: "false"      # no "publish snapshot" to Grafana's cloud
      GF_METRICS_ENABLED: "false"                 # Grafana's own /metrics would be open via the vhost
      GF_ANALYTICS_REPORTING_ENABLED: "false"     # no usage stats to Grafana Labs
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_ANALYTICS_FEEDBACK_LINKS_ENABLED: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"      # no plugin downloads from grafana.com at start
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_UNIFIED_ALERTING_ENABLED: "false"        # alerting lives in Prometheus/Alertmanager
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/amf-fleet.json
      # invite / password-reset emails: Alertmanager's mail account (fill-grafana-smtp.sh copies it)
      GF_SMTP_ENABLED: "true"
      GF_SMTP_HOST: ${GRAFANA_SMTP_HOST:?run fill-grafana-smtp.sh}
      GF_SMTP_USER: ${GRAFANA_SMTP_USER:?run fill-grafana-smtp.sh}
      GF_SMTP_PASSWORD: ${GRAFANA_SMTP_PASSWORD:?run fill-grafana-smtp.sh}
      GF_SMTP_FROM_ADDRESS: ${GRAFANA_SMTP_FROM:?run fill-grafana-smtp.sh}
      GF_SMTP_FROM_NAME: Amfileon Grafana
      GF_SMTP_STARTTLS_POLICY: MandatoryStartTLS   # never send the password unencrypted
      # single sign-on with authentik (https://auth.amf, application "Grafana AMF", slug "grafana-amf"; the existing "Grafana" application is dockprom's LDAP login); stays off
      # until fill-grafana-oauth.sh has put the client ID/secret into .env. The local admin login
      # keeps working as a fallback.
      GF_AUTH_GENERIC_OAUTH_ENABLED: ${GRAFANA_OAUTH_ENABLED:-false}
      GF_AUTH_GENERIC_OAUTH_NAME: authentik
      GF_AUTH_GENERIC_OAUTH_CLIENT_ID: ${GRAFANA_OAUTH_CLIENT_ID:-}
      GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: ${GRAFANA_OAUTH_CLIENT_SECRET:-}
      GF_AUTH_GENERIC_OAUTH_SCOPES: openid profile email entitlements
      GF_AUTH_GENERIC_OAUTH_AUTH_URL: https://auth.amf/application/o/authorize/
      GF_AUTH_GENERIC_OAUTH_TOKEN_URL: https://auth.amf/application/o/token/
      GF_AUTH_GENERIC_OAUTH_API_URL: https://auth.amf/application/o/userinfo/
      GF_AUTH_SIGNOUT_REDIRECT_URL: https://auth.amf/application/o/grafana-amf/end-session/
      GF_AUTH_GENERIC_OAUTH_USE_PKCE: "true"
      GF_AUTH_GENERIC_OAUTH_TLS_CLIENT_CA: /etc/grafana/amfileon-ca.pem   # auth.amf uses the Amfileon CA
      GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP: "true"     # SSO users get a Grafana account on first login
      # two access levels as authentik *application entitlements* on the Grafana application (the
      # approach of authentik's own Grafana guide): "Grafana Admins" → Admin (may change things),
      # "Grafana Viewers" → Viewer (read only). Who may log in at all = the application's bindings.
      # Anyone without one of the two entitlements is refused (strict); roles are re-applied at
      # every login, so changes in authentik take effect at the next login.
      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH: "contains(entitlements[*], 'Grafana Admins') && 'Admin' || contains(entitlements[*], 'Grafana Viewers') && 'Viewer'"
      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_STRICT: "true"
      GF_AUTH_OAUTH_ALLOW_INSECURE_EMAIL_LOOKUP: "true"   # link invited users to their SSO login by email (authentik owns the emails)
    volumes:
      - ./provisioning:/etc/grafana/provisioning:ro
      - ./dashboards:/var/lib/grafana/dashboards:ro
      - ./amfileon-ca.pem:/etc/grafana/amfileon-ca.pem:ro
      - grafana_data:/var/lib/grafana               # users, sessions, preferences
    networks:
      - proxy

volumes:
  grafana_data: {}

networks:
  proxy:
    name: proxy_network
    external: true
