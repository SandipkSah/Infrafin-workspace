apiVersion: 1

# Logs from all hosts (Alloy + promtail → Loki on db1, kept 30 days). Read-only `grafana` user of
# nginx's basic auth on db1.loki.amf (deploy/loki/add-loki-users.sh), verified against the Amfileon CA.
datasources:
  - name: Loki
    uid: loki-db1
    type: loki
    access: proxy
    url: https://db1.loki.amf
    editable: false
    basicAuth: true
    basicAuthUser: grafana
    jsonData:
      tlsAuthWithCACert: true
      maxLines: 1000
      timeout: 120
    secureJsonData:
      basicAuthPassword: $GRAFANA_LOKI_PASSWORD
      tlsCACert: $__file{/etc/grafana/amfileon-ca.pem}
