# Local Grafana on your Mac for building the Amfileon dashboards (needs the VPN).
#   cd prometheus_alloy_monitoring/grafana-local && docker compose up -d
#   open http://localhost:3001   (admin / admin, change on first login)
#
# Reads db1 and db2 Prometheus exactly like dockprom's Grafana on db1 will: HTTPS verified against
# the Amfileon CA + the read-only `grafana` user. The dashboards in ./dashboards are generated by
# gen_dashboards.py and are the same files that will later be provisioned on db1.
services:
  grafana:
    image: grafana/grafana:12.0.2          # same version as dockprom's Grafana on db1
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"              # only reachable from this Mac
    env_file:
      - ../deploy/secrets/grafana.env      # GRAFANA_PROMETHEUS_PASSWORD (never committed)
    environment:
      GF_ANALYTICS_REPORTING_ENABLED: "false"     # no usage stats to Grafana Labs
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_ANALYTICS_FEEDBACK_LINKS_ENABLED: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_UNIFIED_ALERTING_ENABLED: "false"       # alerting lives in Prometheus/Alertmanager
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/amf-fleet.json   # opens on login
      GF_RENDERING_SERVER_URL: http://renderer:8081/render       # local PNG snapshots (review)
      GF_RENDERING_CALLBACK_URL: http://grafana:3000/
    extra_hosts:                                  # in case Docker can't use the VPN's DNS
      - "db1.prometheus.amf:10.10.10.20"
      - "db2.prometheus.amf:10.10.10.21"
    volumes:
      - ./provisioning:/etc/grafana/provisioning:ro
      - ./dashboards:/var/lib/grafana/dashboards:ro
      - ../deploy/ca/amfileon-ca.pem:/etc/grafana/amfileon-ca.pem:ro
      - grafana_data:/var/lib/grafana

  renderer:   # Grafana's official image renderer, only reachable by the grafana container
    image: grafana/grafana-image-renderer:latest
    restart: unless-stopped

volumes:
  grafana_data: {}
