# Local rehearsal of deploy/loki/enable-loki-retention.sh against a copy of db1's Loki.
# Same image, same config, same mounts as /srv/docker/grafana-loki (no data volume, port 3100);
# S3 = local MinIO instead of db1.s3.amf.   Run:  ./rehearse.sh      Remove: docker compose down -v
services:
  minio:                                  # S3 = MinIO like db1.s3.amf (minio/minio images are gone; Bitnami archive)
    image: bitnamilegacy/minio:2025.7.23
    environment: {MINIO_ROOT_USER: rehearsal, MINIO_ROOT_PASSWORD: rehearsal-secret, MINIO_DEFAULT_BUCKETS: loki}
    volumes: [s3:/bitnami/minio/data]
    networks: [loki]
  loki:
    image: grafana/loki:2.9.10
    restart: unless-stopped
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/loki-config.yaml
    depends_on: [minio]
    volumes:
      - ./loki-config.yaml:/etc/loki/loki-config.yaml
    networks: [loki]
volumes: {s3: {}}
networks: {loki: {}}
