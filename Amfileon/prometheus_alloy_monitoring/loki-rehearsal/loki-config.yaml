# COPY of db1:/srv/docker/grafana-loki/loki-config.yaml.sanitized — only the S3 target points to the local MinIO
auth_enabled: false
server:
  http_listen_port: 3100
memberlist:
  join_members:
    - loki:7946
schema_config:
  configs:
    - from: 2024-03-08
      store: tsdb
      object_store: s3
      schema: v12
      index:
        prefix: index_
        period: 24h
limits_config:
  retention_period: 720h        # 30 days (enable-loki-retention.sh)
  reject_old_samples: false
#  reject_old_samples: true
#  reject_old_samples_max_age: 168h
  ingestion_rate_mb: 1024
  ingestion_burst_size_mb: 1024
  per_stream_rate_limit: 512M
  per_stream_rate_limit_burst: 1024M
  cardinality_limit: 200000
  allow_structured_metadata: true
  split_queries_by_interval: 15m
  max_query_parallelism: 32

query_scheduler:
  max_outstanding_requests_per_tenant: 4096

frontend:
  max_outstanding_per_tenant: 4096

query_range:
  parallelise_shardable_queries: true

common:
  path_prefix: /loki
  replication_factor: 1
  storage:
    s3:
      endpoint: minio:9000
      insecure: true
#      insecure: true
      bucketnames: loki
      access_key_id: rehearsal
      secret_access_key: rehearsal-secret
      s3forcepathstyle: true
      http_config:
        insecure_skip_verify: true

# deletes logs older than limits_config.retention_period (enable-loki-retention.sh)
compactor:
  working_directory: /loki/compactor
  shared_store: s3
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 2h
  retention_delete_worker_count: 150
