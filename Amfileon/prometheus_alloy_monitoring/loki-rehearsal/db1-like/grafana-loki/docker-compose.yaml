# rehearsal copy laid out like db1:/srv/docker/grafana-loki/docker-compose.yaml (+ local MinIO as S3)
networks:
  loki:
  proxy:
    name: rehearsal_proxy_network

services:
  loki:
    image: grafana/loki:2.9.10
    restart: unless-stopped
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/loki-config.yaml
    networks:
      - loki
      - proxy
    volumes:
      - ./loki-config.yaml:/etc/loki/loki-config.yaml
      - loki_data:/loki        # WAL, local index, compactor (add-loki-volume.sh)
    environment:
      - VIRTUAL_HOST=${VIRTUAL_HOST}
      - VIRTUAL_POST=${VIRTUAL_POST}

#  promtail:
#    volumes:
#      - ./promtail-config.yaml:/etc/promtail/promtail-config.yaml

  grafana:
    image: busybox:1.36
    restart: unless-stopped
    command: sleep 100000
    networks:
      - loki

  minio:
    image: bitnamilegacy/minio:2025.7.23
    environment: {MINIO_ROOT_USER: rehearsal, MINIO_ROOT_PASSWORD: rehearsal-secret, MINIO_DEFAULT_BUCKETS: loki}
    volumes:
      - s3:/bitnami/minio/data
    networks:
      loki:
        aliases: [minio]

volumes:
  loki_data: {}
  s3:
